name: circuithub

# Shared definition for every process running the PHP application image.
x-app: &app
  build:
    context: .
    args:
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-circuithub-key}
      VITE_REVERB_HOST: ${REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${REVERB_PORT:-8080}
      VITE_REVERB_SCHEME: ${REVERB_SCHEME:-http}
  image: circuithub:latest
  environment: &app-env
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: ${APP_KEY:-base64:bzvnnn0zIOSYZkb0XFAxdHJFxnqTT7k+093dzrZeu3g=}
    APP_DEBUG: "${APP_DEBUG:-true}"
    APP_URL: ${APP_URL:-http://localhost:8000}
    LOG_CHANNEL: stderr

    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-circuithub}
    DB_USERNAME: ${DB_USERNAME:-postgres}
    DB_PASSWORD: ${DB_PASSWORD:-secret}

    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379

    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-circuithub}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-circuithub-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-circuithub-secret}
    REVERB_HOST: reverb
    REVERB_PORT: ${REVERB_PORT:-8080}
    REVERB_SCHEME: ${REVERB_SCHEME:-http}
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-circuithub}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-circuithub}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app
    command: ["php", "artisan", "migrate", "--force", "--isolated"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app
    volumes:
      - public-data:/var/www/html/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start"]
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public-data:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  public-data:
